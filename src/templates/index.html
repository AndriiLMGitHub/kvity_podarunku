<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowers</title>
    <!-- Підключення Tailwind CSS (додається в <head> базового шаблону) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="max-w-10xl mx-auto p-4 sm:p-9">
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8 align-items-stretch"
      >
        {% if products %} {% for product in products %}
        <div
          class="group bg-white rounded-2xl shadow-sm hover:shadow-xl border border-gray-100 overflow-hidden transition-all duration-300 w-full max-w-sm flex flex-col"
        >
          <!-- Блок зображення -->
          <div
            class="relative w-full h-64 overflow-hidden bg-gray-50 border-b border-gray-100"
          >
            <img
              src="{{ product.image.url }}"
              alt="{{ product.name }}"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out"
            />

            <!-- Маркер новинки (умовний) -->
            <div class="absolute top-4 left-4">
              <span
                class="bg-black/80 backdrop-blur-sm text-white text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wide"
              >
                Новинка
              </span>
            </div>
          </div>

          <!-- Текстовий контент -->
          <div class="p-6 flex flex-col flex-grow">
            <h3
              class="text-lg font-bold text-gray-900 mb-2 line-clamp-1"
              title="{{ product.name }}"
            >
              {{ product.name }}
            </h3>

            <!-- Опис обмежено 2 рядками для збереження сітки -->
            <p
              class="text-sm text-gray-500 line-clamp-2 mb-6 flex-grow"
              title="{{ product.description }}"
            >
              {{ product.description }}
            </p>

            <!-- Ціна та дія -->
            <div class="flex items-center justify-between mt-auto">
              <div class="flex flex-col">
                <span
                  class="text-xs text-gray-400 font-medium uppercase tracking-wider mb-1"
                  >Вартість</span
                >
                <span class="text-2xl font-extrabold text-gray-900"
                  >{{ product.price }} ₴</span
                >
              </div>

              <button
                class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold py-2.5 px-5 rounded-xl transition-all duration-200 flex items-center gap-2 shadow-md shadow-indigo-200"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
                  />
                </svg>
                В кошик
              </button>
            </div>
          </div>
        </div>
        {% endfor %} {% else %}
        <h2 class="">Nothing to show!</h2>
        {% endif %}
      </div>
    </div>
  </body>
</html>
